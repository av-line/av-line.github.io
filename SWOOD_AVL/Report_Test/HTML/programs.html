<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="page.title.programs">AV-Line | CNC Programs</title>
  <link rel="stylesheet" href="../CSS/avl-report_colors.css" />
  <link rel="stylesheet" href="../CSS/avl-report_style.css?v=2.1.0" />
  <!-- Google Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <!-- Tabulator CSS & JS -->
  <link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator.min.css" rel="stylesheet">
  <script src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <!-- QR Code (for label PDF printing) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <!-- jsPDF for label printing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Local Static Data -->
  <script charset="windows-1252" src="../JS/tabledata.js"></script>

  <style>
    /* ── Tabulator theme fusion ─────────────────────────────── */
    .tabulator {
      margin-top: 1rem;
      border: 1px solid var(--color-bg-secondary);
      background-color: var(--color-bg-primary);
      color: var(--color-text-primary);
      font-family: inherit;
      border-radius: 1px;
    }
    .tabulator-header {
      border-bottom: 1px solid var(--color-border-hr) !important;
      color: var(--color-text-primary) !important;
    }
    .tabulator-header .tabulator-col {
      background-color: var(--color-bg-sidebar) !important;
      color: var(--color-text-primary) !important;
      border-right: 1px solid var(--color-bg-secondary) !important;
    }
    .tabulator-row {
      background-color: var(--color-bg-sidebar) !important;
      border-bottom: 1px solid var(--color-bg-secondary) !important;
      color: var(--color-text-primary) !important;
      transition: background-color 0.2s;
    }
    .tabulator-row:nth-child(even) {
      background-color: var(--color-bg-primary) !important;
    }
    .tabulator-row:hover {
      background-color: var(--color-hover-secondary) !important;
    }
    .tabulator-row.tabulator-group span {
      color: var(--color-active-primary) !important;
      margin-left: 10px;
    }
    /* ── Completed row override ─────────────────────────────── */
    .tabulator-row.prog-done,
    .tabulator-row.prog-done:nth-child(even),
    .tabulator-row.prog-done:hover {
      background-color: var(--color-done-bg) !important;
      color: var(--color-done-text) !important;
    }
    .tabulator-row.prog-done .tabulator-cell {
      color: var(--color-done-text) !important;
    }

    /* ── Table header panel ─────────────────────────────────── */
    .table-header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 0.5rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .control-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      flex: 1;
    }
    .control-wrapper.search-wrap { max-width: 300px; }
    .control-wrapper.group-wrap  { max-width: 200px; }
    .control-wrapper .control-icon {
      position: absolute;
      left: 10px;
      color: var(--color-active-primary);
      font-size: 20px;
      pointer-events: none;
    }
    #global-search, #group-by {
      padding: 0.5rem 1rem 0.5rem 2.2rem;
      font-size: 1rem;
      border-radius: 1px;
      border: 1px solid var(--color-bg-secondary);
      width: 100%;
      outline: none;
      background-color: var(--color-bg-primary);
      color: var(--color-text-primary);
      font-family: inherit;
    }
    #global-search:focus, #group-by:focus {
      border-color: var(--color-active-primary);
      box-shadow: 0 0 0 2px rgba(0,153,217,0.2);
    }
    #group-by { cursor: pointer; }

    /* ── Icon buttons (export / print) ─────────────────────── */
    .icon-action-btn {
      background-color: var(--color-bg-primary);
      border: 1px solid var(--color-bg-secondary);
      color: var(--color-active-primary);
      border-radius: 1px;
      padding: 0 12px;
      height: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
      font-family: inherit;
      font-size: 0.88rem;
      white-space: nowrap;
    }
    .icon-action-btn:hover, .icon-action-btn.active {
      background-color: var(--color-hover-secondary);
      border-color: var(--color-active-primary);
    }

    /* ── Dropdown menus ─────────────────────────────────────── */
    .dropdown-wrap {
      position: relative;
      display: flex;
      align-items: stretch;
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 5px;
      background-color: var(--color-bg-sidebar);
      border: 1px solid var(--color-bg-secondary);
      box-shadow: 0 4px 12px var(--color-shadow);
      z-index: 200;
      border-radius: 1px;
      overflow: hidden;
      min-width: 200px;
      flex-direction: column;
    }
    .dropdown-menu.show { display: flex; }
    .dropdown-menu button {
      background: none;
      border: none;
      padding: 10px 15px;
      text-align: left;
      color: var(--color-text-primary);
      cursor: pointer;
      border-bottom: 1px solid var(--color-bg-secondary);
      font-family: inherit;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dropdown-menu button:last-child { border-bottom: none; }
    .dropdown-menu button:hover { background-color: var(--color-hover-secondary); }
    .dropdown-menu .dropdown-divider {
      height: 1px;
      background: var(--color-border-hr);
      margin: 2px 0;
    }



    /* ── QR mini cell ────────────────────────────────────── */
    .prog-qr-cell {
      padding: 3px !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .prog-qr-mini {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 2px;
    }
    .prog-qr-mini canvas,
    .prog-qr-mini img { display: block; }

    /* ── Per-row print button ───────────────────────────────── */
    .prog-print-cell {
      padding: 2px !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .prog-row-print-btn {
      background: none;
      border: 1px solid var(--color-bg-secondary);
      color: var(--color-active-primary);
      border-radius: 3px;
      padding: 3px 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .prog-row-print-btn:hover {
      background: var(--color-hover-secondary);
      border-color: var(--color-active-primary);
    }
    .tabulator-row.prog-done .prog-row-print-btn {
      color: #fff;
      border-color: rgba(255,255,255,0.5);
    }

    /* ── Row states ───────────────────────────────────────── */
    .prog-check-cell {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .prog-check {
      width: 16px; height: 16px;
      cursor: pointer;
      accent-color: var(--color-done-bg);
    }
    /* Selected row highlight (mirrors cutting.js .cut-row.selected) */
    .tabulator-row.prog-selected,
    .tabulator-row.prog-selected:nth-child(even) {
      background-color: rgba(0,153,217,0.14) !important;
      outline: 1px solid rgba(0,153,217,0.5);
    }
    .tabulator-row.prog-selected:hover {
      background-color: rgba(0,153,217,0.22) !important;
    }
    /* Selection action bar */
    #prog-sel-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      margin-bottom: 6px;
      background: rgba(0,153,217,0.1);
      border: 1px solid rgba(0,153,217,0.3);
      border-radius: 2px;
      font-size: 0.82rem;
      color: var(--color-active-primary);
      font-weight: 600;
      flex-shrink: 0;
    }
    #prog-mark-done {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      background: var(--color-done-bg);
      color: var(--color-done-text);
      border: none;
      border-radius: 2px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #prog-mark-done:hover { opacity: 0.85; }

    /* QR cell in table */
    .prog-qr-mini {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      overflow: hidden;
      background: #fff;
      border-radius: 2px;
      margin: auto;
    }
    .prog-qr-mini canvas,
    .prog-qr-mini img { display: block; width: 52px !important; height: 52px !important; }
    .prog-qr-cell .tabulator-cell { padding: 2px 3px; }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="site-nav">
    <button class="sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar">
      <span class="material-symbols-rounded">menu</span>
    </button>
  </nav>

  <div class="container">
    <!-- Sidebar -->
    <script charset="UTF-8" src="../JS/avl-report_sidebar.js?v=2.1.0"></script>

    <!-- Main Content -->
    <div class="main-content"
      style="height:100vh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:0;">

      <!-- Header row -->
      <div style="flex-shrink:0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:0.5rem;">
        <h1 class="page-title" style="margin-bottom:0;" data-i18n="page.title.programs">CNC Programs</h1>

        <div class="table-header-panel">
          <div id="item-count-display"
            style="font-weight:600;color:var(--color-active-primary);font-size:1.05rem;padding-left:0.5rem;">
            Total: 0 items
          </div>

          <div style="display:flex;gap:0.5rem;align-items:stretch;flex-wrap:wrap;">

            <!-- Group By -->
            <div class="control-wrapper group-wrap">
              <span class="material-symbols-rounded control-icon">folder_copy</span>
              <select id="group-by" title="Group by field">
                <option value="" data-i18n="ui.group.none">No Grouping</option>
                <option value="SNR_CAB" data-i18n="th.cabsnr">Cabinet SNR</option>
                <option value="PAN_MATREF" data-i18n="th.matref">Material</option>
              </select>
            </div>

            <!-- Search -->
            <div class="control-wrapper search-wrap">
              <span class="material-symbols-rounded control-icon">search</span>
              <input type="text" id="global-search"
                placeholder="Search programs…"
                data-i18n-placeholder="ui.search" />
            </div>


            <!-- Export dropdown -->
            <div class="dropdown-wrap" id="export-dropdown-wrap">
              <button id="export-btn" class="icon-action-btn" title="Export" data-i18n-title="ui.export.tooltip">
                <span class="material-symbols-rounded">file_save</span>
              </button>
              <div id="export-menu" class="dropdown-menu">
                <button id="export-csv" data-i18n="ui.export.csv">Export to CSV</button>
                <button id="export-xlsx" data-i18n="ui.export.xlsx">Export to XLSX</button>
              </div>
            </div>

          </div><!-- /controls -->
        </div>
      </div><!-- /header row -->

      <!-- Multi-select action bar (shown when >1 rows selected, mirrors cutting.js) -->
      <div id="prog-sel-bar">
        <span id="prog-sel-text"></span>
        <button id="prog-mark-done">
          <span class="material-symbols-rounded" style="font-size:15px;">check</span>
          Mark done
        </button>
      </div>

      <!-- Table -->
      <div class="card"
        style="flex:1;margin-bottom:30px;display:flex;flex-direction:column;padding:1px;overflow:hidden;border:none;">
        <div id="data-table" style="flex:1;width:100%;"
          data-col-widths='{"SNR_CAB":"5%","SNR_CABList":"5%","DESCRIPTION":"18%","PAN_MATREF":"10%","PAN_LWEB":"5%","PROG_PHASENAME":"5%","PROG_FILENAME":"15%","TOOLS_STR":"10%","PROG_COMMENT":"10%","PROG_TIME":"5%"}'>
        </div>
      </div>

      <!-- Footer -->
      <div class="doc-footer"
        style="flex-shrink:0;padding:15px;font-size:0.9em;border-top:1px solid var(--color-border-hr);color:var(--color-text-primary);background-color:var(--color-bg-primary);">
        <div style="display:flex;align-items:stretch;justify-content:space-between;gap:20px;">
          <div style="display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr;gap:8px 20px;align-items:baseline;flex:1;">
            <strong style="color:var(--color-text-placeholder);" data-i18n="foot.cus">Cus:</strong>
            <span id="foot-cus"></span>
            <strong style="color:var(--color-text-placeholder);" data-i18n="foot.projnr">ProjNr:</strong>
            <span id="foot-projnr"></span>
            <strong style="color:var(--color-text-placeholder);" data-i18n="foot.eng">Eng:</strong>
            <span id="foot-eng"></span>
            <strong style="color:var(--color-text-placeholder);" data-i18n="foot.projname">ProjName:</strong>
            <span id="foot-projname"></span>
            <strong style="color:var(--color-text-placeholder);" data-i18n="foot.projpos">ProjPos:</strong>
            <span id="foot-projpos"></span>
            <strong style="color:var(--color-text-placeholder);" data-i18n="foot.report">Report:</strong>
            <span id="foot-report"></span>
          </div>
          <!-- Save State icon button -->
          <button id="save-state-btn"
            style="flex-shrink:0;align-self:flex-end;background:none;border:none;cursor:pointer;color:var(--color-text-placeholder);padding:4px 6px;display:flex;align-items:center;transition:color 0.15s;"
            data-i18n-title="ui.save.tooltip"
            title="Save progress"
            onmouseover="this.style.color='var(--color-active-primary)'"
            onmouseout="this.style.color='var(--color-text-placeholder)'">
            <span class="material-symbols-rounded" style="font-size:26px;">download</span>
          </button>
        </div>
      </div>

      <!-- Back to Top -->
      <button id="back-to-top" class="back-to-top-btn" title="Back to Top">
        <span class="material-symbols-rounded">arrow_upward</span>
      </button>
    </div>
  </div>

  <!-- Label print area — populated at print time, hidden at all other times -->
  <div id="label-print-area"
    style="position:fixed;top:-9999px;left:0;visibility:hidden;pointer-events:none;"></div>

  <!-- Print progress overlay -->
  <div id="print-overlay"
    style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.55);
           align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;
           font-family:inherit;font-size:1.1rem;">
    <span class="material-symbols-rounded" style="font-size:48px;animation:spin 1s linear infinite;">autorenew</span>
    <span id="print-overlay-msg" data-i18n="pdf.loading">Generating PDF…</span>
  </div>
  <style>
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>

  <script charset="UTF-8" src="../JS/avl-report_units.js"></script>
  <script charset="UTF-8" src="../JS/avl-report_csv.js"></script>
  <script charset="UTF-8" src="../JS/avl-report_offline-export.js"></script>
  <script charset="UTF-8" src="../JS/avl-report_lang.js"></script>
  <script charset="UTF-8" src="../JS/avl-report_script.js"></script>
  <script charset="UTF-8" src="../JS/avl-report_save.js"></script>
  <script charset="UTF-8" src="../JS/avl-report_labels.js"></script>
  <script charset="UTF-8" src="../JS/avl-report_programs-table.js"></script>
</body>


</html>
