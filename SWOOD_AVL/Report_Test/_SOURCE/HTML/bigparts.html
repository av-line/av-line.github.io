<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="page.title.bigparts">AV-Line | Big Parts</title>
  <link rel="stylesheet" href="../CSS/avl-report_colors.css" />
  <link rel="stylesheet" href="../CSS/avl-report_style.css?v=2.1.0" />
  <!-- Google Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>

  <!-- Tabulator CSS & JS (from CDN) -->
  <link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator.min.css" rel="stylesheet">
  <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>

  <!-- Local Static Data -->
  <script charset="windows-1252" src="../JS/tabledata.js"></script>

  <style>
    /* Base Tabulator Styling */
    .tabulator {
      margin-top: 1rem;
      border: 1px solid var(--color-bg-secondary);
      background-color: var(--color-bg-primary);
      color: var(--color-text-primary);
      font-family: inherit;
      border-radius: 1px;
    }

    .tabulator-header {
      border-bottom: 1px solid var(--color-border-hr) !important;
      color: var(--color-text-primary) !important;
    }

    .tabulator-header .tabulator-col {
      background-color: var(--color-bg-sidebar) !important;
      color: var(--color-text-primary) !important;
      border-right: 1px solid var(--color-bg-secondary) !important;
    }

    .tabulator-row {
      background-color: var(--color-bg-sidebar) !important;
      border-bottom: 1px solid var(--color-bg-secondary) !important;
      color: var(--color-text-primary) !important;
      cursor: pointer;
    }

    .tabulator-row:nth-child(even) {
      background-color: var(--color-bg-primary) !important;
    }

    .tabulator-row:hover {
      background-color: var(--color-hover-secondary) !important;
    }

    /* Search and Group Input */
    .table-header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 0.5rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .control-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      flex: 1;
    }

    .control-wrapper.search-wrap {
      max-width: 300px;
    }

    .control-wrapper .control-icon {
      position: absolute;
      left: 10px;
      color: var(--color-active-primary);
      font-size: 20px;
      pointer-events: none;
    }

    #global-search,
    #detail-global-search {
      padding: 0.5rem 1rem 0.5rem 2.2rem;
      font-size: 1rem;
      border-radius: 1px;
      border: 1px solid var(--color-bg-secondary);
      width: 100%;
      outline: none;
      background-color: var(--color-bg-primary);
      color: var(--color-text-primary);
      font-family: inherit;
    }

    #global-search:focus,
    #detail-global-search:focus {
      border-color: var(--color-active-primary);
      box-shadow: 0 0 0 2px rgba(0, 153, 217, 0.2);
    }

    /* Export Menu */
    .export-icon-btn {
      background-color: var(--color-bg-primary);
      border: 1px solid var(--color-bg-secondary);
      color: var(--color-active-primary);
      border-radius: 1px;
      padding: 0 12px;
      height: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: none;
    }

    .export-icon-btn:hover,
    .export-icon-btn.active {
      background-color: var(--color-hover-secondary);
      border-color: var(--color-active-primary);
    }

    .export-menu-content {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 5px;
      background-color: var(--color-bg-sidebar);
      border: 1px solid var(--color-bg-secondary);
      box-shadow: 0 4px 12px var(--color-shadow);
      z-index: 100;
      border-radius: 1px;
      overflow: hidden;
      min-width: 150px;
    }

    .export-menu-content.show {
      display: flex;
      flex-direction: column;
    }

    .export-menu-content button {
      background: none;
      border: none;
      padding: 10px 15px;
      text-align: left;
      color: var(--color-text-primary);
      cursor: pointer;
      border-bottom: 1px solid var(--color-bg-secondary);
      font-family: inherit;
      white-space: nowrap;
    }

    .export-menu-content button:last-child {
      border-bottom: none;
    }

    .export-menu-content button:hover {
      background-color: var(--color-hover-secondary);
    }

    /* Detail table cells */
    #detail-smallparts-table .tabulator-cell {
      padding: 4px;
    }

    .tabulator-row.tabulator-selected,
    .tabulator-row.tabulator-selected:nth-child(even) {
      background-color: var(--color-sel-row-bg) !important;
      outline: 1px solid var(--color-sel-row-border);
      color: inherit !important;
    }

    .tabulator-row.tabulator-selected:hover {
      background-color: var(--color-sel-row-hover) !important;
    }

    .component-filename {
      color: var(--color-text-placeholder);
    }

    /* BigPart summary section above smallparts */
    #bp-summary-section {
      flex-shrink: 0;
      margin-bottom: 6px;
    }

    #bp-summary-section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--color-active-primary);
      font-weight: 700;
      margin-bottom: 2px;
      padding-left: 2px;
    }

    #bp-summary-table .tabulator {
      margin-top: 0;
    }

    #bp-summary-table .tabulator-row {
      background-color: color-mix(in srgb, var(--color-active-primary) 8%, var(--color-bg-sidebar)) !important;
      font-weight: 600;
      cursor: default;
    }

    #bp-summary-table .tabulator-row:hover {
      background-color: color-mix(in srgb, var(--color-active-primary) 14%, var(--color-bg-sidebar)) !important;
    }

    .viewer-info-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .viewer-info-row .material-symbols-rounded {
      font-size: 20px;
      color: var(--color-active-primary);
      margin-top: 2px;
    }

    .viewer-info-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .viewer-info-text strong {
      color: var(--color-text-primary);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .viewer-info-text span {
      color: var(--color-text-placeholder);
      font-size: 12px;
    }

    /* Back Button */
    #close-detail-btn {
      transition: all 0.2s ease;
      cursor: pointer;
    }

    #close-detail-btn:hover {
      background-color: var(--color-hover-secondary) !important;
      border-color: var(--color-active-primary) !important;
      color: var(--color-active-primary) !important;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="site-nav">
    <button class="sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar">
      <span class="material-symbols-rounded">menu</span>
    </button>
  </nav>

  <div class="container">
    <script charset="UTF-8" src="../JS/avl-report_sidebar.js?v=2.1.0"></script>

    <!-- Main Content -->
    <div class="main-content"
      style="height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0;">

      <!-- ═══ MASTER VIEW: BigPart Assembly List ═══ -->
      <div id="master-view" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
        <div
          style="flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 0.5rem;">
          <h1 class="page-title" style="margin-bottom: 0;" data-i18n="page.title.bigparts">Big Parts</h1>

          <div class="table-header-panel">
            <div id="item-count-display"
              style="font-weight: 600; color: var(--color-active-primary); font-size: 1.05rem; padding-left: 0.5rem;">
              Total: 0 items
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: stretch; flex-wrap: wrap;">
              <div class="control-wrapper search-wrap">
                <span class="material-symbols-rounded control-icon">search</span>
                <input type="text" id="global-search" placeholder="Search across big parts..."
                  data-i18n-placeholder="ui.search" />
              </div>
            </div>
          </div>
        </div>

        <div class="card"
          style="flex: 1; margin-bottom: 15px; display: flex; flex-direction: column; padding: 1px; overflow: hidden; border: none;">
          <div id="bigparts-table" style="flex: 1; width: 100%;"
            data-col-widths='{"BPINDEX":"9%","DESCRIPTION":"35%","QUANTITY":"8%","THUMBNAIL":"160","COMMENT":"48%"}'>
          </div>
        </div>
      </div>

      <!-- ═══ DETAIL VIEW: BigPart + SmallParts + 3D Viewer ═══ -->
      <div id="detail-view"
        style="display: none; flex-direction: column; flex: 1; overflow: hidden; margin-bottom: 15px;">

        <!-- Detail Header / Back Button -->
        <div class="detail-header"
          style="flex-shrink: 0; display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem;">
          <button id="close-detail-btn" class="icon-btn"
            style="background: var(--color-bg-sidebar); border: 1px solid var(--color-border-hr); border-radius: 4px; padding: 5px 12px; display: flex; align-items: center; gap: 6px; font-size: 0.95rem; font-weight: 500; color: var(--color-text-primary);">
            <span class="material-symbols-rounded" style="font-size: 1.2rem;">arrow_back</span>
            <span data-i18n="modal.close" style="color: inherit;">Back</span>
          </button>
          <h2 id="detail-title" style="margin: 0; color: var(--color-text-primary); font-size: 1.25rem;">
            Big Part Details
          </h2>
        </div>

        <div class="detail-main"
          style="display: flex; flex: 1; overflow: hidden; background-color: var(--color-bg-primary); border: 1px solid var(--color-border-hr); border-radius: 4px;">

          <!-- ─── Left Panel: BigPart Summary Row + SmallParts Table ─── -->
          <div class="detail-left"
            style="flex: 1; display: flex; flex-direction: column; padding: 10px; border-right: 1px solid var(--color-border-hr); background: var(--color-bg-primary); overflow: hidden;">

            <!-- TO_BIGPART summary row (single-row table) -->
            <div id="bp-summary-section">
              <div id="bp-summary-section-label" data-i18n="th.bp_summary">TO_BIGPART</div>
              <div id="bp-summary-table"
                data-col-widths='{"BPINDEX":"9%","DESCRIPTION":"30%","BP_MATREF":"15%","BP_L":"8%","BP_W":"8%","BP_T":"7%","LAM_INFO":"15%","QUANTITY":"8%"}'>
              </div>
            </div>

            <!-- SmallParts Table header controls -->
            <div class="table-header-panel" style="margin-bottom: 0.5rem; margin-top: 4px;">
              <div style="display: flex; align-items: baseline; gap: 12px; margin-right: auto;">
                <h3 style="margin: 0; color: var(--color-text-primary);" data-i18n="th.smallparts">Small Parts</h3>
                <div id="detail-item-count-display"
                  style="font-weight: 600; color: var(--color-active-primary); font-size: 1.05rem;">
                  Total: 0 items
                </div>
              </div>

              <div style="display: flex; gap: 0.5rem; align-items: stretch; flex-wrap: wrap;">
                <div class="control-wrapper search-wrap">
                  <span class="material-symbols-rounded control-icon">search</span>
                  <input type="text" id="detail-global-search" placeholder="Search..."
                    data-i18n-placeholder="ui.search" />
                </div>

                <div class="export-dropdown" style="position: relative; display: flex; align-items: stretch;">
                  <button id="export-detail-btn" class="export-icon-btn" title="Save / Export Details"
                    data-i18n-title="ui.export.tooltip">
                    <span class="material-symbols-rounded">file_save</span>
                  </button>
                  <div id="export-detail-menu" class="export-menu-content">
                    <button id="export-detail-csv" data-i18n="ui.export.csv">Export to CSV</button>
                    <button id="export-detail-xlsx" data-i18n="ui.export.xlsx">Export to XLSX</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- SmallParts Tabulator -->
            <div id="detail-smallparts-table" style="flex: 1; min-height: 200px; overflow: auto;"
              data-col-widths='{"SPINDEX":"8%","DESCRIPTION":"30%","BP_L":"10%","BP_W":"10%","BP_T":"8%","SNR_CAB":"12%","SNR_CABList":"22%"}'>
            </div>
          </div>

          <!-- ─── Right Panel: 3D Viewer + Thumbnail/Info ─── -->
          <div class="detail-right"
            style="flex: 1; display: flex; flex-direction: column; background: var(--color-bg-sidebar);">
            <!-- BigPart Label Image -->
            <div class="detail-viewer-wrapper"
              style="flex: 1.5; border-bottom: 1px solid var(--color-border-hr); position: relative; background: var(--color-bg-primary); display: flex; align-items: center; justify-content: center; padding: 10px;">
              <img id="bp-label-img" src="" alt="Big Part Label" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none'" onload="this.style.display='block'" />
            </div>

            <!-- BP Info + Thumbnail bottom area -->
            <div class="detail-thumbnail-wrapper"
              style="flex: 1; display: flex; align-items: stretch; justify-content: space-between; padding: 20px; gap: 20px; background: var(--color-bg-primary);">
              <!-- Detailed Info Panel (left side) -->
              <div id="panel-details-container"
                style="flex: 1; display: flex; flex-direction: column; gap: 12px; font-size: 0.95rem; color: var(--color-text-primary); border-right: 1px solid var(--color-border-hr); padding-right: 20px; min-width: 220px;">
                
                <h4 id="details-header"
                  style="margin: 0; color: var(--color-text-placeholder); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px;">
                  Big Part Info</h4>

                <!-- BigPart Specific Info (Default) -->
                <div id="bigpart-info-group" style="display: flex; flex-direction: column; gap: 8px;">
                  <div style="display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;">
                    <span style="color: var(--color-text-placeholder);" data-i18n="th.bpindex">BP Index</span>
                    <span id="bp-detail-bpindex">-</span>
                    <span style="color: var(--color-text-placeholder);" data-i18n="ui.desc_short">Desc</span>
                    <strong id="bp-detail-desc">-</strong>
                    <span style="color: var(--color-text-placeholder);" data-i18n="ui.qty_short">Qty</span>
                    <span id="bp-detail-qty">-</span>
                    <span style="color: var(--color-text-placeholder);" data-i18n="ui.file">File</span>
                    <span id="bp-detail-file" style="font-size: 0.85em;">-</span>
                  </div>
                  <div
                    style="margin-top: 5px; padding: 8px; background: var(--color-hover-secondary); border-radius: 2px; font-style: italic; font-size: 0.9em; min-height: 40px;"
                    id="bp-detail-comment">
                    -
                  </div>
                </div>

                <!-- Component Specific Info (Visible when smallpart selected) -->
                <div id="component-info-group" style="display: none; flex-direction: column; gap: 15px;">
                  <div class="detail-group">
                    <strong
                      style="display: block; color: var(--color-active-primary); margin-bottom: 5px; text-transform: uppercase; font-size: 0.8rem;"
                      data-i18n="ui.edges">Kanten</strong>
                    <div style="display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;">
                      <span data-i18n="ui.edges.l">L:</span> <span id="detail-eb-l">-</span>
                      <span data-i18n="ui.edges.r">R:</span> <span id="detail-eb-r">-</span>
                      <span data-i18n="ui.edges.f">V:</span> <span id="detail-eb-f">-</span>
                      <span data-i18n="ui.edges.b">H:</span> <span id="detail-eb-b">-</span>
                    </div>
                  </div>
                  <div class="detail-group">
                    <strong
                      style="display: block; color: var(--color-active-primary); margin-bottom: 5px; text-transform: uppercase; font-size: 0.8rem;"
                      data-i18n="ui.lam">Belag</strong>
                    <div style="display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;">
                      <span data-i18n="ui.lam.o">O:</span> <span id="detail-lam-o">-</span>
                      <span data-i18n="ui.lam.u">U:</span> <span id="detail-lam-u">-</span>
                    </div>
                  </div>
                  <div class="detail-group">
                    <strong
                      style="display: block; color: var(--color-active-primary); margin-bottom: 5px; text-transform: uppercase; font-size: 0.8rem;"
                      data-i18n="ui.cnc">CNC</strong>
                    <div style="display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;">
                      <span>A:</span> <span id="detail-cnc-a">-</span>
                      <span>B:</span> <span id="detail-cnc-b">-</span>
                    </div>
                  </div>
                  <div id="comp-comment-group" style="display: flex; flex-direction: column; gap: 4px;">
                    <strong
                      style="display: block; color: var(--color-active-primary); text-transform: uppercase; font-size: 0.8rem; margin-bottom: 2px;"
                      data-i18n="th.comment">Comment</strong>
                    <div id="comp-detail-comment"
                      style="padding: 8px 10px; background: var(--color-hover-secondary); border-left: 3px solid var(--color-active-primary); border-radius: 2px; font-style: italic; font-size: 0.88em; line-height: 1.5; min-height: 38px; color: var(--color-text-primary); word-break: break-word;">
                      —</div>
                  </div>
                </div>
              </div>
              <!-- Thumbnail (right side) -->
              <div id="detail-thumbnail-wrapper"
                style="flex: 2; display: flex; align-items: center; justify-content: center; position: relative;">
                <img id="detail-thumbnail-img" src="" alt="Thumbnail"
                  style="max-width: 100%; max-height: 100%; object-fit: contain;"
                  onerror="this.style.display='none'"
                  onload="this.style.display='block'" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Document Footer -->
      <div class="doc-footer"
        style="flex-shrink: 0; padding: 15px; font-size: 0.9em; border-top: 1px solid var(--color-border-hr); color: var(--color-text-primary); background-color: var(--color-bg-primary);">
        <div
          style="display: grid; grid-template-columns: auto 1fr auto 1fr auto 1fr; gap: 8px 20px; align-items: baseline;">
          <strong style="color: var(--color-text-placeholder);" data-i18n="foot.cus">Cus:</strong>
          <span id="foot-cus"></span>
          <strong style="color: var(--color-text-placeholder);" data-i18n="foot.projnr">ProjNr:</strong>
          <span id="foot-projnr"></span>
          <strong style="color: var(--color-text-placeholder);" data-i18n="foot.eng">Eng:</strong>
          <span id="foot-eng"></span>
          <strong style="color: var(--color-text-placeholder);" data-i18n="foot.projname">ProjName:</strong>
          <span id="foot-projname"></span>
          <strong style="color: var(--color-text-placeholder);" data-i18n="foot.projpos">ProjPos:</strong>
          <span id="foot-projpos"></span>
          <strong style="color: var(--color-text-placeholder);" data-i18n="foot.report">Report:</strong>
          <span id="foot-report"></span>
        </div>
      </div>
    </div>
  </div>

  <script charset="UTF-8" src="../JS/avl-report_units.js"></script>
  <script charset="UTF-8" src="../JS/avl-report_csv.js"></script>
  <script charset="UTF-8" src="../JS/avl-report_offline-export.js"></script>
  <script charset="UTF-8" src="../JS/avl-report_lang.js"></script>
  <script charset="UTF-8" src="../JS/avl-report_script.js"></script>
  <!-- Big Parts Module Logic -->
  <script charset="UTF-8" src="../JS/avl-report_bigparts-logic.js?v=1.0.0"></script>
</body>

</html>
